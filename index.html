        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, setDoc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase Configuration & Variables setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ibc-course-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {

        let currentUserAuth = null;
        let unsubscribeStudents = null;

        // State Management

            searchQuery: '',

            ],

            students: [],

            // Initial Mock Data (used if Firestore collection is empty on first run)
            initialMockStudents: [
                { id: 'std_1', name: 'Andi Wijaya', course: 'komputer', level: 'Web Development', status: 'aktif', fee: 350000, phone: '081234567890', joinDate: '2026-09-10', attendance: { '2026-11-01': 'Hadir', '2026-11-02': 'Hadir' }, instructorId: 'inst_1' },
                { id: 'std_2', name: 'Bella Safira', course: 'inggris', level: 'Intermediate Speaking', status: 'aktif', fee: 300000, phone: '082345678901', joinDate: '2026-08-15', attendance: { '2026-11-01': 'Hadir', '2026-11-02': 'Izin' }, instructorId: 'inst_2' },
                { id: 'std_3', name: 'Citra Kirana', course: 'komputer', level: 'Desain Grafis', status: 'lulus', fee: 350000, phone: '083456789012', joinDate: '2026-05-01', attendance: { '2026-11-01': 'Hadir', '2026-11-02': 'Hadir' }, instructorId: 'inst_1' },
                { id: 'std_4', name: 'Deni Sumargo', course: 'inggris', level: 'TOEFL Preparation', status: 'aktif', fee: 400000, phone: '084567890123', joinDate: '2026-10-01', attendance: { '2026-11-01': 'Alpha', '2026-11-02': 'Hadir' }, instructorId: 'inst_2' },
                { id: 'std_5', name: 'Eka Putra', course: 'komputer', level: 'Python Programming', status: 'aktif', fee: 380000, phone: '085678901234', joinDate: '2026-09-20', attendance: { '2026-11-01': 'Hadir', '2026-11-02': 'Hadir' }, instructorId: 'inst_3' },
                { id: 'std_6', name: 'Fiona Putri', course: 'inggris', level: 'Basic Grammar', status: 'lulus', fee: 300000, phone: '086789012345', joinDate: '2026-04-10', attendance: { '2026-11-01': 'Hadir', '2026-11-02': 'Hadir' }, instructorId: 'inst_2' },
                { id: 'std_7', name: 'Gilang Ramadhan', course: 'komputer', level: 'Office Suite Pro', status: 'aktif', fee: 250000, phone: '087890123456', joinDate: '2026-10-12', attendance: { '2026-11-01': 'Hadir', '2026-11-02': 'Sakit' }, instructorId: 'inst_1' },
                { id: 'std_8', name: 'Hany Nur', course: 'inggris', level: 'Business Communication', status: 'aktif', fee: 350000, phone: '088901234567', joinDate: '2026-09-01', attendance: { '2026-11-01': 'Hadir', '2026-11-02': 'Hadir' }, instructorId: 'inst_2' }
            ],

            selectedAttendanceDate: new Date().toISOString().split('T')[0]
        };

        // Track editing student ID (null if adding new)
        let editingStudentId = null;

        // --- FIRESTORE PERSISTENCE LOGIC ---
        function getStudentsCollectionRef() {
            return collection(db, 'artifacts', appId, 'public', 'data', 'students');
        }

        function getStudentDocRef(studentId) {
            return doc(db, 'artifacts', appId, 'public', 'data', 'students', studentId);
        }

        async function initAuthAndFirestore() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth Error:", err);
            }

            onAuthStateChanged(auth, (user) => {
                currentUserAuth = user;
                if (user) {
                    setupRealtimeStudentsListener();
                }
            });
        }

        function setupRealtimeStudentsListener() {
            if (!currentUserAuth) return;
            if (unsubscribeStudents) unsubscribeStudents();

            const colRef = getStudentsCollectionRef();
            unsubscribeStudents = onSnapshot(colRef, async (snapshot) => {
                if (snapshot.empty && state.students.length === 0) {
                    await seedInitialStudents();
                } else {
                    const loadedStudents = [];
                    snapshot.forEach(docSnap => {
                        loadedStudents.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    state.students = loadedStudents;
                    state.isLoading = false;
                    render();
                }
            }, (error) => {
                console.error("Error listening to students data:", error);
                showToast("Gagal menyinkronkan data dari cloud", "error");
            });
        }

        async function seedInitialStudents() {
            try {
                const batch = writeBatch(db);
                state.initialMockStudents.forEach(st => {
                    const docRef = getStudentDocRef(st.id);
                    batch.set(docRef, st);
                });
                await batch.commit();
            } catch (e) {
                console.error("Failed to seed data:", e);
            }
        }

        // Helper: Calculate attendance stats for a student
        function getAttendanceStats(attendanceObj) {
            if (!attendanceObj) return { hadir: 0, izin: 0, sakit: 0, alpha: 0, total: 0 };
            const records = Object.values(attendanceObj);
            return {
                hadir: records.filter(st => st === 'Hadir').length,
                izin: records.filter(st => st === 'Izin').length,
                sakit: records.filter(st => st === 'Sakit').length,
                alpha: records.filter(st => st === 'Alpha').length,
                total: records.length
            };
        }

        // Helper: Seed initial meetings for past/existing students
        function createInitialAttendance(initialMeetingsCount, joinDateStr) {
            const attendance = {};
            const count = parseInt(initialMeetingsCount) || 0;
            if (count <= 0) return attendance;

            const baseDate = joinDateStr ? new Date(joinDateStr) : new Date();
            for (let i = 0; i < count; i++) {
                const d = new Date(baseDate);
                d.setDate(d.getDate() - (count - i));
                const dateKey = d.toISOString().split('T')[0];
                attendance[dateKey] = 'Hadir';
            }
            return attendance;
        }

        // Toast Notification Utility
        window.showToast = function(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = message;

            if (type === 'success') {
                toastIcon.className = 'fas fa-check-circle text-emerald-400 text-lg';
            } else if (type === 'error') {
                toastIcon.className = 'fas fa-exclamation-circle text-rose-400 text-lg';
            } else {
                toastIcon.className = 'fas fa-info-circle text-sky-400 text-lg';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        };

        // Format Currency
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        // Action Handlers
        window.login = function(email, password) {
            const found = state.instructors.find(i => i.email === email && i.pass === password);
            if (found) {
                state.currentUser = found;
                showToast(`Selamat datang kembali, ${found.name}!`);
                render();
            } else {
                showToast('Email atau password salah!', 'error');
            }
        };

        window.logout = function() {
            state.currentUser = null;
            state.activeTab = 'dashboard';
            showToast('Berhasil keluar dari akun.', 'info');
            render();
        };

        window.switchTab = function(tabName) {
            state.activeTab = tabName;
            render();
        };

        window.setCourseFilter = function(category) {
            state.courseFilter = category;
            render();
        };

        window.updateAttendance = async function(studentId, date, status) {
            if (!currentUserAuth) return;
            const student = state.students.find(s => s.id === studentId);
            if (student) {
                const updatedAttendance = { ...(student.attendance || {}), [date]: status };
                try {
                    await updateDoc(getStudentDocRef(studentId), { attendance: updatedAttendance });
                    showToast(`Absensi ${student.name} diperbarui menjadi ${status}`);
                } catch (e) {
                    console.error("Error updating attendance:", e);
                    showToast("Gagal mengupdate absensi ke cloud", "error");
                }
            }
        };

        window.openAddStudentModal = function() {
            editingStudentId = null;
            const form = document.getElementById('student-form');
            if (form) form.reset();
            const modalTitle = document.getElementById('modal-title');
            if (modalTitle) modalTitle.innerText = 'Tambah Siswa Baru';
            const joinInput = document.getElementById('student_join_date');
            if (joinInput) joinInput.value = new Date().toISOString().split('T')[0];
            toggleModal('add-student-modal', true);
        };

        // Import Excel Logic
        window.triggerExcelImport = function() {
            document.getElementById('excel-file-input').click();
        };

        window.handleExcelUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonResult = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (!jsonResult || jsonResult.length === 0) {
                        showToast('File Excel kosong atau format tidak sesuai!', 'error');
                        return;
                    }

                    let addedCount = 0;
                    const batch = writeBatch(db);

                    jsonResult.forEach(row => {
                        const name = row['Nama'] || row['Nama Siswa'] || row['nama'] || row['Name'];
                        if (!name) return;

                        const courseRaw = String(row['Kursus'] || row['kursus'] || row['Course'] || 'komputer').toLowerCase();
                        const course = courseRaw.includes('inggris') || courseRaw.includes('english') ? 'inggris' : 'komputer';
                        const level = row['Level'] || row['Tingkat'] || row['level'] || 'Umum';
                        const fee = parseFloat(row['Biaya'] || row['Biaya Perbulan'] || row['fee'] || 0) || 0;
                        const phone = String(row['WA'] || row['WhatsApp'] || row['No WA'] || row['phone'] || '');
                        const statusRaw = String(row['Status'] || row['status'] || 'aktif').toLowerCase();
                        const status = statusRaw.includes('lulus') ? 'lulus' : 'aktif';
                        const joinDate = row['Tanggal Mulai'] || row['Tgl Mulai'] || new Date().toISOString().split('T')[0];

                        const newId = 'std_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                        const newStudent = {
                            id: newId,
                            name: String(name).trim(),
                            course: course,
                            level: String(level).trim(),
                            fee: fee,
                            phone: phone.trim(),
                            status: status,
                            attendance: {},
                            joinDate: String(joinDate).trim(),
                            instructorId: state.currentUser ? state.currentUser.id : state.instructors[0].id
                        };

                        batch.set(getStudentDocRef(newId), newStudent);
                        addedCount++;
                    });

                    if (addedCount > 0) {
                        await batch.commit();
                        showToast(`Berhasil mengimpor & menyimpan ${addedCount} data siswa!`);
                    } else {
                        showToast('Tidak ada data siswa yang valid ditemukan dalam file.', 'error');
                    }
                } catch (err) {
                    console.error(err);
                    showToast('Gagal membaca atau menyimpan file Excel.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        };

        window.openEditStudentModal = function(studentId) {
            const student = state.students.find(s => s.id === studentId);
            if (!student) return;

            editingStudentId = studentId;
            const stats = getAttendanceStats(student.attendance);

            document.getElementById('modal-title').innerText = 'Edit Data Siswa';
            document.getElementById('student_name').value = student.name;
            document.getElementById('student_course').value = student.course;
            document.getElementById('student_level').value = student.level;
            document.getElementById('student_fee').value = student.fee || 0;
            document.getElementById('student_phone').value = student.phone || '';
            document.getElementById('student_join_date').value = student.joinDate || new Date().toISOString().split('T')[0];
            document.getElementById('student_status').value = student.status;
            document.getElementById('student_initial_meetings').value = stats.hadir || 0;

            toggleModal('add-student-modal', true);
        };

        window.deleteStudent = async function(studentId) {
            const student = state.students.find(s => s.id === studentId);
            if (!student) return;

            showDeleteConfirmModal(student.name, async () => {
                try {
                    await deleteDoc(getStudentDocRef(studentId));
                    showToast(`Siswa ${student.name} berhasil dihapus permanen.`);
                } catch (e) {
                    console.error("Error deleting student:", e);
                    showToast("Gagal menghapus siswa dari database", "error");
                }
            });
        };

        let onConfirmDeleteCallback = null;
        function showDeleteConfirmModal(studentName, onConfirm) {
            onConfirmDeleteCallback = onConfirm;
            const container = document.getElementById('confirm-modal-container');
            if (container) {
                document.getElementById('confirm-student-name').innerText = studentName;
                container.classList.remove('hidden');
                container.classList.add('flex');
            }
        }

        window.confirmDeleteAction = function() {
            if (onConfirmDeleteCallback) onConfirmDeleteCallback();
            closeConfirmModal();
        };

        window.closeConfirmModal = function() {
            const container = document.getElementById('confirm-modal-container');
            if (container) {
                container.classList.remove('flex');
                container.classList.add('hidden');
            }
            onConfirmDeleteCallback = null;
        };

        window.toggleStudentStatus = async function(studentId) {
            const student = state.students.find(s => s.id === studentId);
            if (student) {
                const nextStatus = student.status === 'aktif' ? 'lulus' : 'aktif';
                try {
                    await updateDoc(getStudentDocRef(studentId), { status: nextStatus });
                    showToast(`Status ${student.name} diperbarui menjadi ${nextStatus}`);
                } catch (e) {
                    console.error("Error updating student status:", e);
                    showToast("Gagal memperbarui status ke cloud", "error");
                }
            }
        };

        window.saveStudent = async function(event) {
            event.preventDefault();
            const form = event.target;
            const name = form.student_name.value.trim();
            const course = form.student_course.value;
            const level = form.student_level.value.trim();
            const fee = parseFloat(form.student_fee.value) || 0;
            const phone = form.student_phone.value.trim();
            const joinDate = form.student_join_date.value;
            const status = form.student_status.value;
            const initialMeetings = parseInt(form.student_initial_meetings.value) || 0;

            if (!name || !level || !joinDate) {
                showToast('Harap isi semua bidang yang wajib!', 'error');
                return;
            }

            try {
                if (editingStudentId) {
                    const student = state.students.find(s => s.id === editingStudentId);
                    let updatedAttendance = { ...(student?.attendance || {}) };
                    const currentStats = getAttendanceStats(updatedAttendance);

                    // Adjust attendance records if initial meeting count was updated directly
                    if (initialMeetings !== currentStats.hadir) {
                        updatedAttendance = createInitialAttendance(initialMeetings, joinDate);
                    }

                    await updateDoc(getStudentDocRef(editingStudentId), {
                        name,
                        course,
                        level,
                        fee,
                        phone,
                        joinDate,
                        status,
                        attendance: updatedAttendance
                    });
                    showToast('Data siswa berhasil diperbarui!');
                } else {
                    const newId = 'std_' + Date.now();
                    const newStudent = {
                        id: newId,
                        name: name,
                        course: course,
                        level: level,
                        fee: fee,
                        phone: phone,
                        status: status,
                        attendance: createInitialAttendance(initialMeetings, joinDate),
                        joinDate: joinDate,
                        instructorId: state.currentUser ? state.currentUser.id : state.instructors[0].id
                    };
                    await setDoc(getStudentDocRef(newId), newStudent);
                    showToast('Siswa baru berhasil ditambahkan & tersimpan!');
                }

                toggleModal('add-student-modal', false);
            } catch (err) {
                console.error("Error saving student:", err);
                showToast("Gagal menyimpan data ke database cloud.", "error");
            }
        };

        window.toggleModal = function(modalId, show) {
            const modal = document.getElementById(modalId);
            if (modal) {
                if (show) {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                } else {
                    modal.classList.remove('flex');
                    modal.classList.add('hidden');
                }
            }
        };

        function filterStudents() {
            return state.students.filter(student => {
                const matchesCourse = state.courseFilter === 'all' || student.course === state.courseFilter;
                const matchesSearch = student.name.toLowerCase().includes(state.searchQuery.toLowerCase()) || 
                                     student.level.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                                     (student.phone && student.phone.includes(state.searchQuery));
                return matchesCourse && matchesSearch;
            });
        }

            `;
        }

        function renderEarningsTab() {
            const user = state.currentUser;
            const userStudents = state.students.filter(s => state.courseFilter === 'all' || s.course === state.courseFilter);
            const activeStudents = userStudents.filter(s => s.status === 'aktif');
            const graduatedStudents = userStudents.filter(s => s.status === 'lulus');

            const ratePerStudent = user ? user.ratePerStudent : 0;
            const activeIncome = activeStudents.length * ratePerStudent;
            const potentialBonus = graduatedStudents.length * 50000;
            const totalEstimated = activeIncome + potentialBonus;

            // Accurate total meetings sum (Student A + Student B + ...)
            const totalMeetingsSum = userStudents.reduce((sum, s) => sum + getAttendanceStats(s.attendance).hadir, 0);

            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800">Estimasi Pendapatan</h2>
                            <p class="text-xs text-slate-500">Rincian komisi berdasarkan jumlah siswa aktif, pertemuan, & kelulusan</p>
                        </div>
                        ${renderCourseFilter()}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div class="bg-gradient-to-br from-indigo-600 to-indigo-800 rounded-2xl p-6 text-white shadow-xl shadow-indigo-600/20 flex flex-col justify-between">
                            <div>
                                <span class="text-xs font-medium text-indigo-200 uppercase tracking-wider">Total Est. Honor Bulan Ini</span>
                                <h3 class="text-3xl font-extrabold mt-2">${formatRupiah(totalEstimated)}</h3>
                            </div>
                            <div class="mt-6 pt-4 border-t border-indigo-500/40 text-xs text-indigo-200 flex justify-between">
                                <span>Total Sesi Pertemuan:</span>
                                <span class="font-semibold text-white">${totalMeetingsSum} Pertemuan</span>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between">
                            <div>
                                <span class="text-xs font-medium text-slate-500">Pendapatan Siswa Aktif</span>
                                <h3 class="text-2xl font-bold text-slate-800 mt-2">${formatRupiah(activeIncome)}</h3>
                                <p class="text-xs text-slate-500 mt-1">${activeStudents.length} siswa aktif × ${formatRupiah(ratePerStudent)}</p>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2 mt-4 overflow-hidden">
                                <div class="bg-emerald-500 h-2 rounded-full" style="width: 75%"></div>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between">
                            <div>
                                <span class="text-xs font-medium text-slate-500">Bonus Completion (Lulusan)</span>
                                <h3 class="text-2xl font-bold text-slate-800 mt-2">${formatRupiah(potentialBonus)}</h3>
                                <p class="text-xs text-slate-500 mt-1">${graduatedStudents.length} siswa lulus × Rp 50.000 (Bonus)</p>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2 mt-4 overflow-hidden">
                                <div class="bg-blue-500 h-2 rounded-full" style="width: 45%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-5 border-b border-slate-100">
                            <h3 class="font-bold text-slate-800 text-base">Rincian Akumulasi Per Siswa</h3>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 text-[11px] font-semibold text-slate-500 uppercase tracking-wider">
                                        <th class="py-3.5 px-5">Siswa</th>
                                        <th class="py-3.5 px-5">Kursus</th>
                                        <th class="py-3.5 px-5">Jumlah Pertemuan (Siswa A + B...)</th>
                                        <th class="py-3.5 px-5">Status</th>
                                        <th class="py-3.5 px-5 text-right">Estimasi Kontribusi Honor</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${userStudents.map(s => {
                                        const income = s.status === 'aktif' ? ratePerStudent : 50000;
                                        const stats = getAttendanceStats(s.attendance);
                                        return `
                                            <tr class="hover:bg-slate-50/50 transition">
                                                <td class="py-3.5 px-5 font-semibold text-slate-800">${s.name}</td>
                                                <td class="py-3.5 px-5">
                                                    <span class="px-2 py-0.5 text-xs rounded font-medium ${s.course === 'komputer' ? 'bg-blue-50 text-blue-700' : 'bg-emerald-50 text-emerald-700'}">
                                                        ${s.course === 'komputer' ? 'Komputer' : 'B. Inggris'}
                                                    </span>
                                                </td>
                                                <td class="py-3.5 px-5">
                                                    <span class="text-xs font-semibold text-violet-700 bg-violet-50 px-2.5 py-1 rounded-lg border border-violet-100">
                                                        ${stats.hadir} Sesi Hadir
                                                    </span>
                                                </td>
                                                <td class="py-3.5 px-5">
                                                    <span class="px-2.5 py-1 text-xs rounded-full font-semibold ${s.status === 'aktif' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}">
                                                        ${s.status === 'aktif' ? 'Aktif (Honor Bulanan)' : 'Lulus (Bonus Selesai)'}
                                                    </span>
                                                </td>
                                                <td class="py-3.5 px-5 text-right font-bold ${s.status === 'aktif' ? 'text-emerald-600' : 'text-blue-600'}">
                                                    +${formatRupiah(income)}
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAddStudentModal() {
            return `
                <div id="add-student-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-5 max-h-[90vh] overflow-y-auto custom-scrollbar">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                            <h3 id="modal-title" class="font-bold text-slate-800 text-lg">Tambah Siswa Baru</h3>
                            <button onclick="toggleModal('add-student-modal', false)" class="text-slate-400 hover:text-slate-600 text-lg">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>

                        <form id="student-form" onsubmit="saveStudent(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-700 mb-1">Nama Lengkap Siswa *</label>
                                <input type="text" id="student_name" name="student_name" required placeholder="Contoh: Budi Santoso" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-medium text-slate-700 mb-1">Kategori Kursus *</label>
                                    <select id="student_course" name="student_course" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                        <option value="komputer">💻 Komputer</option>
                                        <option value="inggris">🇬🇧 Bahasa Inggris</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-700 mb-1">Tingkat / Level Materi *</label>
                                    <input type="text" id="student_level" name="student_level" required placeholder="Contoh: TOEFL / Web Design" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div>
                                    <label class="block text-xs font-medium text-slate-700 mb-1">Biaya Per Bulan (Rp) *</label>
                                    <input type="number" id="student_fee" name="student_fee" required min="0" placeholder="350000" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-700 mb-1">Total Pertemuan Awal</label>
                                    <input type="number" id="student_initial_meetings" name="student_initial_meetings" min="0" value="0" placeholder="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" title="Isi jumlah pertemuan yang sudah diikuti jika siswa lama">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-700 mb-1">Nomor WhatsApp</label>
                                    <input type="tel" id="student_phone" name="student_phone" placeholder="081234567890" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-medium text-slate-700 mb-1">Tanggal Mulai Kursus *</label>
                                    <input type="date" id="student_join_date" name="student_join_date" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-700 mb-1">Status Siswa *</label>
                                    <select id="student_status" name="student_status" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                        <option value="aktif">Aktif</option>
                                        <option value="lulus">Lulus</option>
                                    </select>
                                </div>
                            </div>

                            <div class="flex space-x-3 pt-3">
                                <button type="button" onclick="toggleModal('add-student-modal', false)" class="flex-1 py-2.5 border border-slate-200 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">Batal</button>
                                <button type="submit" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-indigo-600/20 transition">Simpan Data Siswa</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderConfirmModal() {
            return `
                <div id="confirm-modal-container" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 text-center space-y-4">
                        <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-xl">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-800 text-base">Hapus Data Siswa?</h4>
                            <p class="text-xs text-slate-500 mt-1">Apakah Anda yakin ingin menghapus <strong id="confirm-student-name" class="text-slate-700"></strong>? Tindakan ini tidak dapat dibatalkan.</p>
                        </div>
                        <div class="flex space-x-3 pt-2">
                            <button onclick="closeConfirmModal()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition">Batal</button>
                            <button onclick="confirmDeleteAction()" class="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-semibold shadow-md transition">Hapus Permanen</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Main Render Function
        function render() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                app.innerHTML = renderLogin();
                return;
            }

            let tabContent = '';
            if (state.activeTab === 'dashboard') {
                tabContent = renderDashboard();
            } else if (state.activeTab === 'students') {
                tabContent = renderStudentsTab();
            } else if (state.activeTab === 'attendance') {
                tabContent = renderAttendanceTab();
            } else if (state.activeTab === 'earnings') {
                tabContent = renderEarningsTab();
            }

            app.innerHTML = `
                ${renderNavbar()}
                ${renderTabs()}
                <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
                    ${tabContent}
                </main>
                ${renderAddStudentModal()}
                ${renderConfirmModal()}
            `;
        }

        // Initialize App & Firebase
        window.onload = function() {
            initAuthAndFirestore();
            render();
        };
    </script>
</body>
</html>
